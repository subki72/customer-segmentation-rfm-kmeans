[project]
name = "customer-segmentation-rfm-kmeans"
version = "1.0.0"
description = "Customer segmentation pipeline and FastAPI microservice combining RFM modeling and K-Means clustering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "matplotlib==3.9.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "scikit-learn==1.5.2",
    "seaborn==0.13.2",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "flake8==7.1.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.17.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
